<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modifier une partie du brief</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&amp;family=DM+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#d68a63}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #050505; color: #ffffff; font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.45; overflow: hidden">
  <dc-import name="Menu" actif="style" hint-size="232px,900px"></dc-import>
  <div style="flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column">
    <header style="flex: none; height: 68px; box-sizing: border-box; padding: 0 32px; border-bottom: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; gap: 16px">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 30px">Le style</h1>
      <span style="color: rgba(255,255,255,0.64); font-size: 13px">Votre composition · magazine 1</span>
    </header>
    <div aria-hidden="true" style="flex: 1; padding: 24px 32px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; opacity: 0.35">
      <span style="height: 300px; border-radius: 16px; background: rgba(255,255,255,0.06)"></span>
      <span style="height: 300px; border-radius: 16px; background: rgba(255,255,255,0.06)"></span>
      <span style="height: 300px; border-radius: 16px; background: rgba(255,255,255,0.06)"></span>
      <span style="height: 300px; border-radius: 16px; background: rgba(255,255,255,0.06)"></span>
    </div>

    <div style="position: absolute; inset: 0; display: flex; justify-content: flex-end; background: rgba(0,0,0,0.45)">
      <section role="dialog" aria-labelledby="titre-partie" style="width: 560px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: rgba(20,20,20,0.86); border-left: 1px solid rgba(255,255,255,0.14); border-radius: 24px 0 0 24px">
        <div style="flex: none; padding: 24px 28px 18px; border-bottom: 1px solid rgba(255,255,255,0.10); display: flex; align-items: flex-start; gap: 16px">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
            <h2 id="titre-partie" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 30px">La palette</h2>
            <span style="color: rgba(255,255,255,0.64); font-size: 13px">Seulement ce que vous modifiez. Votre choix reste en haut.</span>
          </div>
          <button type="button" aria-label="Fermer" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #ffffff">✕</button>
        </div>
        <div style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 28px; display: flex; flex-direction: column; gap: 18px">
          <sc-for list="{{ groupes }}" as="g" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; gap: 10px">
              <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.64)">{{ g.titre }}</span>
              <sc-for list="{{ g.palettes }}" as="p" hint-placeholder-count="2">
                <button type="button" aria-pressed="{{ p.choisie }}" style="display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 14px; border: 1px solid {{ p.bord }}; background: {{ p.fond }}; color: #ffffff; font: inherit; text-align: left">
                  <span style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 140px; height: 40px; border-radius: 6px; overflow: hidden; flex: none">
                    <span style="background: {{ p.c0 }}"></span><span style="background: {{ p.c1 }}"></span><span style="background: {{ p.c2 }}"></span><span style="background: {{ p.c3 }}"></span>
                  </span>
                  <span style="flex: 1; display: flex; flex-direction: column"><strong style="font-weight: 500">{{ p.nom }}</strong><span style="font-size: 12px; color: rgba(255,255,255,0.64)">du style {{ p.style }}</span></span>
                  <span style="font-size: 12px; color: #d68a63">{{ p.etat }}</span>
                </button>
              </sc-for>
            </div>
          </sc-for>
          <a href="Main.dc.html" style="font-size: 13px">Voir tout le style Riviera, puis revenir ici →</a>
        </div>
        <div style="flex: none; padding: 14px 28px 20px; border-top: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 13px; color: rgba(255,255,255,0.64)">Enregistré à chaque clic</span>
          <button type="button" style="height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: #d68a63; color: #050505; font: inherit; font-weight: 600">Terminé</button>
        </div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (nom, style, c, choisie) => ({
      nom, style, c0: c[0], c1: c[1], c2: c[2], c3: c[3], choisie,
      etat: choisie ? 'Votre choix' : '',
      bord: choisie ? '#d68a63' : 'rgba(255,255,255,0.10)',
      fond: choisie ? 'rgba(214,138,99,0.16)' : 'rgba(255,255,255,0.04)'
    });
    return {
      groupes: [
        { titre: 'Votre choix', palettes: [p('Marine', 'Riviera', ['#e9dcc6', '#1d3557', '#2f5d8a', '#f6efe3'], true)] },
        { titre: 'Du même style', palettes: [p('Sable', 'Riviera', ['#f6efe3', '#3b2f25', '#c9a45c', '#e9dcc6'], false), p('Large', 'Riviera', ['#dfe7ee', '#0f2a44', '#2f5d8a', '#ffffff'], false)] },
        { titre: 'Des autres styles', palettes: [p('Gala', 'Nuit', ['#0d0f1a', '#f3e7c9', '#c9a45c', '#232740'], false), p('Papier', 'Éditorial', ['#f4f1ec', '#111111', '#b5452f', '#d9cfc2'], false)] }
      ]
    };
  }
}
</script>
</body>
</html>
