<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ouvrir un document dans la page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&amp;family=DM+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#d68a63}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #050505; color: #ffffff; font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.45; overflow: hidden">
  <dc-import name="Menu" actif="documents" hint-size="232px,900px"></dc-import>
  <div style="flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column">
    <header style="flex: none; height: 68px; box-sizing: border-box; padding: 0 32px; border-bottom: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; gap: 16px">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 30px">Documents</h1>
      <span style="color: rgba(255,255,255,0.64); font-size: 13px">Tout ce qui est signé, facturé ou envoyé</span>
    </header>
    <div aria-hidden="true" style="flex: 1; padding: 24px 32px; display: flex; flex-direction: column; gap: 10px; opacity: 0.3">
      <span style="height: 64px; border-radius: 14px; background: rgba(255,255,255,0.06)"></span>
      <span style="height: 64px; border-radius: 14px; background: rgba(255,255,255,0.06)"></span>
    </div>
    <div style="position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,0.55)">
      <section role="dialog" aria-labelledby="titre-doc" style="width: 980px; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 24px; border: 1px solid rgba(255,255,255,0.14); background: rgba(20,20,20,0.94); overflow: hidden">
        <div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.10)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d68a63" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg>
          <span style="flex: 1; display: flex; flex-direction: column">
            <strong id="titre-doc" style="font-weight: 500">Devis signé</strong>
            <span style="font-size: 12px; color: rgba(255,255,255,0.64)">14 octobre 2026 · PDF · 2 pages</span>
          </span>
          <a href="#" aria-label="Télécharger le document" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); color: #ffffff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 13px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"></path></svg>
            Télécharger
          </a>
          <button type="button" aria-label="Fermer" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #ffffff; display: grid; place-items: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </div>
        <div style="flex: 1; min-height: 0; display: grid; place-items: center; padding: 24px; background: rgba(255,255,255,0.03)">
          <div role="img" aria-label="Première page du devis" style="width: 470px; height: 664px; box-sizing: border-box; padding: 44px 40px; background: #f7f3ec; color: #1c1c1c; border-radius: 4px; display: flex; flex-direction: column; gap: 14px">
            <span style="font-family: 'Cormorant Garamond', serif; font-size: 28px">Devis</span>
            <span style="height: 1px; background: rgba(28,28,28,0.2)"></span>
            <sc-for list="{{ lignes }}" as="l" hint-placeholder-count="8">
              <span style="display: flex; gap: 12px"><span style="height: 8px; border-radius: 4px; background: rgba(28,28,28,0.16); width: {{ l.a }}"></span><span style="margin-left: auto; height: 8px; width: 60px; border-radius: 4px; background: rgba(28,28,28,0.16)"></span></span>
            </sc-for>
            <span style="margin-top: auto; align-self: flex-end; font-size: 12px; color: rgba(28,28,28,0.6)">Signé le 14 octobre 2026</span>
          </div>
        </div>
        <div style="flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px; border-top: 1px solid rgba(255,255,255,0.10); font-size: 13px">
          <button type="button" aria-label="Page précédente" disabled style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: rgba(255,255,255,0.4)">‹</button>
          <span>Page 1 sur 2</span>
          <button type="button" aria-label="Page suivante" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); background: transparent; color: #ffffff">›</button>
        </div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { lignes: ['70%', '55%', '62%', '48%', '66%', '40%', '58%', '52%'].map((a) => ({ a })) };
  }
}
</script>
</body>
</html>
