<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu sans la boîte de l'édition</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&amp;family=DM+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#d68a63}a:hover{color:#ffffff}
</style>
</helmet>
<aside aria-label="Navigation" style="width: 232px; height: 900px; box-sizing: border-box; padding: 22px 12px 16px; display: flex; flex-direction: column; gap: 18px; background: #0a0a0a; border-right: 1px solid rgba(255,255,255,0.10); color: #ffffff; font-family: 'DM Sans', sans-serif; font-size: 14px">
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 12px 6px">
    <img src="/_blob/2010bc71db4044732422bdb7d46d8e64" alt="Bellajour" style="width: 116px; height: auto">
    <span style="display: flex; flex-direction: column; font-size: 13px; line-height: 1.35">
      <span style="color: rgba(255,255,255,0.88)">Séminaire d'automne</span>
      <span style="font-size: 12px; color: rgba(255,255,255,0.64)">Maison Aubier</span>
    </span>
  </div>
  <nav style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{ haut }}" as="it" hint-placeholder-count="5">
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: {{ it.couleur }}; background: {{ it.fond }}; font-weight: {{ it.graisse }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect></svg>
        {{ it.libelle }}
      </a>
    </sc-for>
    <span style="height: 1px; margin: 10px 12px; background: rgba(255,255,255,0.10)"></span>
    <sc-for list="{{ bas }}" as="it" hint-placeholder-count="2">
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: {{ it.couleur }}; background: {{ it.fond }}; font-weight: {{ it.graisse }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"></path></svg>
        {{ it.libelle }}
      </a>
    </sc-for>
  </nav>
  <div style="margin-top: auto; padding: 14px 12px 0; border-top: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; gap: 10px">
    <span style="width: 32px; height: 32px; border-radius: 999px; background: rgba(214,138,99,0.16); display: grid; place-items: center; font-size: 12px; font-weight: 600">CE</span>
    <span style="flex: 1; display: flex; flex-direction: column"><span>Camille Essai</span><span style="font-size: 12px; color: rgba(255,255,255,0.64)">Responsable du BAT</span></span>
    <button type="button" aria-label="Passer en mode jour" style="width: 32px; height: 32px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: rgba(255,255,255,0.64)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg>
    </button>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"actif":{"editor":"enum","options":["tableau","style","photos","bat","livraison","atelier","documents"],"default":"tableau"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const actif = this.props.actif ?? 'tableau';
    const ligne = (cle, libelle) => ({
      libelle,
      couleur: cle === actif ? '#ffffff' : 'rgba(255,255,255,0.72)',
      fond: cle === actif ? 'rgba(214,138,99,0.16)' : 'transparent',
      graisse: cle === actif ? '600' : '400'
    });
    return {
      haut: [ligne('tableau', 'Tableau de bord'), ligne('style', 'Style'), ligne('photos', 'Photos'), ligne('bat', 'Bon à tirer'), ligne('livraison', 'Livraison')],
      bas: [ligne('atelier', "Parler à l'atelier"), ligne('documents', 'Documents')]
    };
  }
}
</script>
</body>
</html>
